name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The tests run on synthetic series and never hit the network, so the heavy
      # model dependencies (TensorFlow, ReservoirPy) are not installed here.
      - name: Install
        run: pip install numpy pandas scikit-learn pytest
      - name: Test
        run: pytest tests -q
